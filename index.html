<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>月亮與行星</title>
<style>
  :root{--bg:#0a0f24;--panel:rgba(22,31,70,.78);--line:rgba(160,180,255,.18);--ink:#f2f4ff;--muted:#aab3dc;--sun:#ffd166}
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;color:var(--ink);
    background:
      radial-gradient(1200px 600px at 85% -10%, #26336f 0%, transparent 60%),
      radial-gradient(900px 500px at -10% 25%, #1a2355 0%, transparent 55%),
      var(--bg);
    font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
    font-size:17px;line-height:1.7;
    display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.55;
    background-image:
      radial-gradient(1.2px 1.2px at 20px 30px,#fff,transparent),
      radial-gradient(1px 1px at 140px 80px,#fff,transparent),
      radial-gradient(1.5px 1.5px at 210px 190px,#ffeebb,transparent),
      radial-gradient(1px 1px at 60px 220px,#fff,transparent),
      radial-gradient(1px 1px at 180px 20px,#cfe3ff,transparent);
    background-size:260px 260px;
  }
  h1{margin:0 0 28px;font-size:44px;line-height:1.3;text-align:center}
  h1 span{color:var(--sun)}
  .grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px;width:100%;max-width:1500px}
  a.card{
    display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--ink);
    background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px 20px;
    transition:transform .15s,border-color .15s,background .15s;
  }
  a.card:hover,a.card:focus-visible{transform:translateY(-4px);border-color:var(--sun);background:rgba(34,46,100,.9);outline:none}
  .num{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
  .ico{font-size:52px;line-height:1.2}
  .card h2{margin:0;font-size:22px;line-height:1.35;color:var(--sun)}
  .card p{margin:0;color:#dfe4ff;font-size:15.5px}
</style>
</head>
<body>
  <h1><span>月亮</span>與<span>行星</span></h1>
  <main class="grid">
    <a class="card" href="html/01_moon-phases.html">
      <span class="num">01</span><span class="ico">🌙</span>
      <h2>月亮變變變</h2>
      <p>上弦月、下弦月是怎麼來的？地球自轉、四季和月亮的亮面。</p>
    </a>
    <a class="card" href="html/02_earth-moon-orbit.html">
      <span class="num">02</span><span class="ico">🌍</span>
      <h2>地球帶著月亮跑</h2>
      <p>月亮跟著地球繞太陽，日食和月食為什麼一年只有兩個食季？</p>
    </a>
    <a class="card" href="html/03_eclipses.html">
      <span class="num">03</span><span class="ico">📅</span>
      <h2>未來 20 年日食月食</h2>
      <p>2027～2046 年的 89 場日食和月食，台灣看不看得到？</p>
    </a>
    <a class="card" href="html/04_planets.html">
      <span class="num">04</span><span class="ico">🪐</span>
      <h2>八大行星</h2>
      <p>自轉軸、大小、英文名字怎麼唸，還有太陽系的軌道圖。</p>
    </a>
    <a class="card" href="html/05_quiz.html">
      <span class="num">05</span><span class="ico">⭐</span>
      <h2>小測驗</h2>
      <p>月亮和地球的 12 題，看看你記得多少！</p>
    </a>
  </main>
</body>
</html>
